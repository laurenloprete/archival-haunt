<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archival Haunt</title>
<meta name="description" content="Archival haunt commences.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    /* sampled from the image's own margin: pure black, so the scan edges
       dissolve into the page instead of showing a seam */
    --bg: #000000;
    --ink: #ffffff;
    --gutter: clamp(20px, 4vw, 44px);
    --logo-w: clamp(188px, 24vw, 300px);
    /* the mark's 411 x 34 viewBox, cropped to the trimmed strike's bounds */
    --logo-h: calc(var(--logo-w) * 0.0827);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    min-height: 100%;
  }

  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: calc((var(--gutter) * 2 + var(--logo-h)) * 0.5) var(--gutter) var(--gutter);
    overflow-x: hidden;
  }

  /* ---- logo ---------------------------------------------------------- */

  .logo {
    position: fixed;
    top: var(--gutter);
    right: var(--gutter);
    width: var(--logo-w);
    color: var(--ink);
    z-index: 2;
    opacity: 0;
    animation: fade 1.2s ease-out 0.15s forwards;
  }

  .logo__mark {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  /* Default state carries the strike; on hover the line fades out in
     place, staying put the whole time. */
  .logo__strike {
    opacity: 1;
    transition: opacity 275ms ease-in-out;
  }

  .logo:hover .logo__strike,
  .logo:focus-visible .logo__strike {
    opacity: 0;
  }

  .logo:focus-visible { outline: none; }

  /* ---- memo ---------------------------------------------------------- */

  .memo {
    display: block;
    max-width: min(100%, 860px);
    max-height: calc(100svh - (var(--gutter) * 3) - var(--logo-h));
    width: auto;
    height: auto;
    object-fit: contain;
    /* a hair counter-clockwise, so the sheet reads as set down by hand
       rather than pasted onto a grid */
    transform: rotate(-1.5deg);
    opacity: 0;
    animation: fade 1.6s ease-out 0.3s forwards;
  }

  /* Desktop only: 25% wider cap. Unconstrained by the footer — the footer
     is fixed and stays pinned in its corners, so the memo is free to run
     under it and the page scrolls to show the rest. */
  @media (min-width: 641px) {
    .memo { max-width: min(100%, 1344px); }
  }

  @keyframes fade { to { opacity: 1; } }

  /* ---- footer --------------------------------------------------------- */

  .footer__link {
    position: fixed;
    bottom: var(--gutter);
    left: var(--gutter);
    z-index: 2;
    font-family: 'DM Mono', ui-monospace, monospace;
    font-style: normal;
    font-weight: 500;
    font-size: 12px;
    line-height: 201%;
    text-align: center;
    letter-spacing: 0.63em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    opacity: 1;
    transition: opacity 275ms ease-in-out;
  }

  .footer__link:hover,
  .footer__link:focus-visible {
    opacity: 0.6;
  }

  .footer__link:focus-visible { outline: none; }

  /* ---- newsletter ------------------------------------------------------ */

  .newsletter {
    position: fixed;
    bottom: var(--gutter);
    right: var(--gutter);
    z-index: 2;
    transform: scale(0.75);
    transform-origin: right center;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .newsletter__input {
    box-sizing: border-box;
    width: min(311px, 60vw);
    height: 42px;
    padding: 0 18px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: 'DM Mono', ui-monospace, monospace;
    font-style: normal;
    font-weight: 400;
    font-size: 12px;
  }

  .newsletter__input::placeholder {
    color: var(--ink);
    opacity: 1;
  }

  .newsletter__button {
    box-sizing: border-box;
    flex: none;
    width: 48px;
    height: 42px;
    padding: 0;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--bg);
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: 1;
    transition: opacity 275ms ease-in-out;
  }

  .newsletter__button svg {
    display: block;
    width: 20px;
    height: 20px;
  }

  .newsletter__button:hover,
  .newsletter__button:focus-visible {
    opacity: 0.6;
  }

  .newsletter__button:focus-visible { outline: none; }

  /* 500px is where the layout runs out of give: 4vw drops under the 20px
     gutter floor and --logo-w has already bottomed out at its 188px
     minimum, so from here down the wordmark's share of the content width
     only climbs (41% at 500px, 56% at 375px, 67% at 320px) and it stops
     reading as a corner mark. Shrink it and center it instead. */
  @media (max-width: 500px) {
    :root { --logo-w: 150px; }

    .logo {
      right: auto;
      left: 50%;
      transform: translateX(-50%);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, .memo { animation: none; opacity: 1; }
    .logo__strike, .footer__link, .newsletter__button { transition: none; }
  }
</style>
</head>
